[project]
name = "IND320-hush"
version = "0.1.0"
description = "IND320-hush Streamlit app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "streamlit>=1.61.1",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["src", "src.streamlit", "src.streamlit.pages", "src.utils"]
package-dir = { "src" = "src" }
